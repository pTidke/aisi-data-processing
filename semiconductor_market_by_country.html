    <script>
        // Animate bars growing from zero
        const chartDiv = document.getElementById('semi-chart');

        // Wait for Plotly to render
        setTimeout(() => {
            const data = chartDiv.data;
            const originalY = data.map(trace => [...trace.y]);

            // Set all bars to zero
            data.forEach(trace => {
                trace.y = trace.y.map(() => 0);
            });

            Plotly.react(chartDiv, data, chartDiv.layout, chartDiv.config);

            // Animate to real values with stagger
            setTimeout(() => {
                data.forEach((trace, i) => {
                    trace.y = originalY[i];
                });

                Plotly.animate(chartDiv, {
                    data: data,
                    traces: data.map((_, i) => i),
                }, {
                    transition: {
                        duration: 1200,
                        easing: 'cubic-in-out',
                    },
                    frame: {
                        duration: 1200,
                    },
                });
            }, 400);
        }, 300);
    </script>
